name: Build VisionClaw IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version
      - name: Create Secrets.swift
        run: cp samples/CameraAccess/CameraAccess/Secrets.swift.example samples/CameraAccess/CameraAccess/Secrets.swift
      - name: Create Signing Cert
        run: |
          security create-keychain -p "" build.keychain
          security set-keychain-settings build.keychain
          security unlock-keychain -p "" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/cert.key -out /tmp/cert.crt -days 1 -nodes \
            -subj "/CN=iPhone Developer" \
            -extensions v3_req \
            -addext "extendedKeyUsage=codeSigning"
          openssl pkcs12 -export -out /tmp/cert.p12 -inkey /tmp/cert.key -in /tmp/cert.crt -passout pass:
          security import /tmp/cert.p12 -k build.keychain -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          CERT_NAME=$(security find-identity -p codesigning -v build.keychain | head -1 | awk -F '"' '{print $2}')
          echo "CERT_NAME=$CERT_NAME" >> $GITHUB_ENV
      - name: Resolve Package Dependencies
        run: cd samples/CameraAccess && xcodebuild -resolvePackageDependencies -project CameraAccess.xcodeproj -scheme CameraAccess
      - name: Build App
        run: |
          set -o pipefail
          cd samples/CameraAccess
          xcodebuild build \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            CODE_SIGN_IDENTITY="$CERT_NAME" \
            CODE_SIGNING_REQUIRED=YES \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" \
            CONFIGURATION_BUILD_DIR=$(pwd)/build/Release-iphoneos \
            2>&1 | tee /tmp/build.log
          echo "=== BUILD FILES ==="
          find $(pwd)/build -type f | head -60
      - name: Package IPA
        run: |
          APP=$(find samples/CameraAccess/build/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          [ -z "$APP" ] && { echo ERROR No app found; exit 1; }
          [ ! -f "$APP/CameraAccess" ] && { echo ERROR Binary missing; ls -la "$APP/"; exit 1; }
          mkdir -p /tmp/Payload && cp -r "$APP" /tmp/Payload/
          cd /tmp && zip -r VisionClaw.ipa Payload/
          mv /tmp/VisionClaw.ipa $GITHUB_WORKSPACE/VisionClaw.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-IPA
          path: VisionClaw.ipa
          retention-days: 7
          if-no-files-found: error
