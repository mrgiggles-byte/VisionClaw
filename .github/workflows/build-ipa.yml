name: Build VisionClaw IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version

      - name: Create Secrets.swift
        run: cp samples/CameraAccess/CameraAccess/Secrets.swift.example samples/CameraAccess/CameraAccess/Secrets.swift

      - name: Resolve Package Dependencies
        run: cd samples/CameraAccess && xcodebuild -resolvePackageDependencies -project CameraAccess.xcodeproj -scheme CameraAccess

      - name: Build App (ad-hoc)
        run: |
          set -o pipefail
          cd samples/CameraAccess
          xcodebuild build \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR=$(pwd)/build/Release-iphoneos \
            2>&1 | tee /tmp/build.log
          echo "=== BUILD FILES ==="
          find $(pwd)/build -type f | head -60

      - name: Verify Binary
        run: |
          APP=$(find samples/CameraAccess/build/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          [ -z "$APP" ] && { echo "ERROR: No .app found"; tail -60 /tmp/build.log; exit 1; }
          [ ! -f "$APP/CameraAccess" ] && { echo "ERROR: Binary missing"; ls -la "$APP/"; grep -E "error:" /tmp/build.log | tail -20; exit 1; }
          echo "Binary found"
          codesign -dv "$APP" 2>&1 || true

      - name: Package IPA
        run: |
          APP=$(find samples/CameraAccess/build/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          mkdir -p /tmp/Payload
          cp -r "$APP" /tmp/Payload/
          cd /tmp && zip -r VisionClaw.ipa Payload/
          mv /tmp/VisionClaw.ipa $GITHUB_WORKSPACE/VisionClaw.ipa
          echo "IPA size: $(ls -lh $GITHUB_WORKSPACE/VisionClaw.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-IPA
          path: VisionClaw.ipa
          retention-days: 7
          if-no-files-found: error
